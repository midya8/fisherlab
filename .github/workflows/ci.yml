name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m fisherlab demo > /tmp/demo.json
      - run: python -m fisherlab audit examples/input.json > /tmp/audit.json
      - run: python examples/render_audit.py --check
      - run: python -m fisherlab context-demo > /tmp/context-demo.json
      - run: python -m fisherlab contexts examples/contexts-input.json > /tmp/contexts.json
      - run: python examples/render_contexts.py --check
      - run: python -m pip install setuptools wheel
      - run: pip wheel --no-deps --no-build-isolation . -w /tmp/wheels
      - run: pip install --no-deps /tmp/wheels/fisherlab-0.2.0-py3-none-any.whl
      - run: cd /tmp && fisherlab demo > /tmp/wheel-demo.json
      - run: cd /tmp && fisherlab audit "$GITHUB_WORKSPACE/examples/input.json" > /tmp/wheel-audit.json
      - run: python -c "import json; assert json.load(open('/tmp/demo.json'))==json.load(open('/tmp/wheel-demo.json')); assert json.load(open('/tmp/audit.json'))==json.load(open('/tmp/wheel-audit.json'))"
      - run: cd /tmp && fisherlab context-demo > /tmp/wheel-context-demo.json
      - run: cd /tmp && fisherlab contexts "$GITHUB_WORKSPACE/examples/contexts-input.json" > /tmp/wheel-contexts.json
      - run: python -c "import json; assert json.load(open('/tmp/context-demo.json'))==json.load(open('/tmp/wheel-context-demo.json')); assert json.load(open('/tmp/contexts.json'))==json.load(open('/tmp/wheel-contexts.json'))"
