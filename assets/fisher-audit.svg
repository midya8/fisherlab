<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940">
<title>FisherLab: local geometry is not a finite-step optimizer guarantee</title>
<desc>Exact rational categorical Fisher systems, coordinate counterexamples, a nonlinear finite-step audit and a local KL comparison.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#dbeafe;font-size:15px}.muted{fill:#94a3b8}.mono{font-family:monospace;font-size:15px}.head{fill:#67e8f9;font-weight:600}.title{font-size:28px;font-weight:700}.small{font-size:13px}.warn{fill:#fbbf24}</style>
<rect width="1120" height="940" fill="#0f172a"/>
<metadata id="full-witness" encoding="zlib-base64-json"></metadata>
<text x="30" y="43" class="title" fill="#dbeafe" font-size="28" font-family="DejaVu Sans,sans-serif" font-weight="700">FisherLab | exact geometry, visible limits</text>
<text x="30" y="73" class="muted" fill="#94a3b8" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="400">p=(1/2,1/3,1/6), rewards=(0,1,3), expected reward=5/6, variance=41/36</text>
<text x="30" y="99" class="muted" fill="#94a3b8" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="400">Four full-tangent charts agree exactly. A restricted chart changes the reachable model.</text>
