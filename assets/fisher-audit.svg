<text x="190" y="735" class="head small" fill="#67e8f9" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="700">actual KL(p || p_new)</text>
<text x="392" y="735" class="head small" fill="#67e8f9" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="700">local eta^2 Var(r)/2</text>
<text x="620" y="735" class="head small" fill="#67e8f9" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="700">actual new reward</text>
