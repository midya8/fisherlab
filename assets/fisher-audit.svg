<text x="30" y="929" class="muted small" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">Standard natural-gradient ideas: Kakade (2001), Martens (2020). Not an MDP, neural trainer or superiority benchmark.</text>
