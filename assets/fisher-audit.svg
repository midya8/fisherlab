<text x="42" y="403" class="muted small" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">Free variables are set to zero by exact RREF. This is not a minimum-norm pseudoinverse.</text>
<rect x="25" y="440" width="587" height="219" rx="12" fill="#18253b" stroke="#334155"/>
<rect x="628" y="440" width="467" height="219" rx="12" fill="#18253b" stroke="#334155"/>
<text x="43" y="470" class="head" fill="#67e8f9" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="700">A nonlinear chart: same tangent, different step</text>
<text x="43" y="495" class="small" fill="#dbeafe" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">Binary p(1)=sigmoid(z), z=theta^3, theta=1, eta=1/2</text>
<text x="43" y="523" class="small muted" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">natural dz / natural dtheta</text>
<text id="nonlinear-0" x="335" y="523" class="mono" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="400">1 / 1/3</text>
<text x="43" y="550" class="small muted" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">direct / mapped Euler logit</text>
<text id="nonlinear-1" x="335" y="550" class="mono" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="400">3/2 / 343/216</text>
<text x="43" y="577" class="small muted" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">logit difference (exact)</text>
<text id="nonlinear-2" x="335" y="577" class="mono" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="400">19/216</text>
<text x="43" y="604" class="small muted" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">direct / curved p(1)</text>
<text id="nonlinear-3" x="335" y="604" class="mono" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="400">0.817574 / 0.830329</text>
<text x="646" y="470" class="head" fill="#67e8f9" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="700">Singular metric, inspectable certificates</text>
<text x="646" y="499" class="small" fill="#dbeafe" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">G = sum over i&lt;j p[i] p[j] d[i,j] d[i,j]^T</text>
<text x="646" y="525" class="mono" fill="#dbeafe" font-size="15" font-family="monospace" font-weight="400">d[i,j] = A[i,:] - A[j,:]</text>
<text x="646" y="553" class="small" fill="#dbeafe" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">Every weight is positive. Null directions map to dp=0.</text>
<text x="646" y="582" class="small" fill="#dbeafe" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">Full charts: derivative = metric length = reward variance.</text>
<text x="646" y="610" class="small warn" fill="#fbbf24" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">Restricted chart: orthogonal projection, not a failed solve.</text>
<text x="646" y="639" class="small muted" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif" font-weight="400">Complete rational matrices, nullspaces and Gram witness in JSON.</text>
<rect x="25" y="678" width="1070" height="200" rx="12" fill="#18253b" stroke="#334155"/>
<text x="43" y="708" class="head" fill="#67e8f9" font-size="15" font-family="DejaVu Sans,sans-serif" font-weight="700">Local KL approximation is not an exact finite-step constraint</text>
