<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880">
<title>FisherLab: sharing parameters creates context tradeoffs</title>
<desc>Exact local derivatives and metric projection certificates under fixed exogenous context frequencies.</desc>
<rect width="1120" height="880" fill="#0f172a"/>
<metadata id="full-witness" encoding="zlib-base64-json"></metadata>
<text x="28" y="43" fill="#dbeafe" font-size="28" font-weight="700" font-family="DejaVu Sans,sans-serif">FisherLab | sharing creates context tradeoffs</text>
<text x="28" y="73" fill="#94a3b8" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Known exogenous context weights, conditional softmax policies and one shared local parameter.</text>
<rect x="25" y="95" width="523" height="119" rx="12" fill="#18253b" stroke="#334155"/>
<rect x="565" y="95" width="530" height="119" rx="12" fill="#18253b" stroke="#334155"/>
<text x="44" y="125" fill="#67e8f9" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Context 0</text>
<text x="44" y="153" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">weight 3/4   p=(1/2,1/2)   rewards=(0,1)</text>
<text x="44" y="183" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">A rows=(0),(1): action-1 probability rises with theta</text>
<text x="584" y="125" fill="#67e8f9" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Context 1</text>
<text x="584" y="153" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">weight 1/4   p=(1/2,1/2)   rewards=(0,-2)</text>
<text x="584" y="183" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Same A and theta: action-1 probability also rises here</text>
<rect x="25" y="231" width="1070" height="211" rx="12" fill="#18253b" stroke="#334155"/>
<text x="44" y="262" fill="#67e8f9" font-size="13" font-weight="700" font-family="DejaVu Sans,sans-serif">model / objective</text>
<text x="321" y="262" fill="#67e8f9" font-size="13" font-weight="700" font-family="DejaVu Sans,sans-serif">rank / dim</text>
<text x="445" y="262" fill="#67e8f9" font-size="13" font-weight="700" font-family="DejaVu Sans,sans-serif">direction v</text>
<text x="580" y="262" fill="#67e8f9" font-size="13" font-weight="700" font-family="DejaVu Sans,sans-serif">dJ context0</text>
<text x="715" y="262" fill="#67e8f9" font-size="13" font-weight="700" font-family="DejaVu Sans,sans-serif">dJ context1</text>
<text x="848" y="262" fill="#67e8f9" font-size="13" font-weight="700" font-family="DejaVu Sans,sans-serif">weighted dJ</text>
<text x="985" y="262" fill="#67e8f9" font-size="13" font-weight="700" font-family="DejaVu Sans,sans-serif">residual^2</text>
<text id="chart-0-0" x="44" y="302" fill="#dbeafe" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">weighted, shared</text>
<text id="chart-0-1" x="321" y="302" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">1 / 1</text>
<text id="chart-0-2" x="445" y="302" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">1/4</text>
<text id="chart-0-3" x="580" y="302" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">1/16</text>
<text id="chart-0-4" x="715" y="302" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">-1/8</text>
<text id="chart-0-5" x="848" y="302" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">1/64</text>
<text id="chart-0-6" x="985" y="302" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">27/64</text>
<text id="chart-1-0" x="44" y="345" fill="#dbeafe" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">weighted, independent</text>
<text id="chart-1-1" x="321" y="345" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">2 / 2</text>
<text id="chart-1-2" x="445" y="345" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">1,-2</text>
<text id="chart-1-3" x="580" y="345" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">1/4</text>
<text id="chart-1-4" x="715" y="345" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">1</text>
<text id="chart-1-5" x="848" y="345" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">7/16</text>
<text id="chart-1-6" x="985" y="345" fill="#dbeafe" font-size="15" font-weight="400" font-family="monospace">0</text>
<text id="chart-2-0" x="44" y="388" fill="#fbbf24" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">uniform, shared (new objective)</text>
<text id="chart-2-1" x="321" y="388" fill="#fbbf24" font-size="15" font-weight="400" font-family="monospace">1 / 1</text>
<text id="chart-2-2" x="445" y="388" fill="#fbbf24" font-size="15" font-weight="400" font-family="monospace">-1/2</text>
<text id="chart-2-3" x="580" y="388" fill="#fbbf24" font-size="15" font-weight="400" font-family="monospace">-1/8</text>
<text id="chart-2-4" x="715" y="388" fill="#fbbf24" font-size="15" font-weight="400" font-family="monospace">1/4</text>
<text id="chart-2-5" x="848" y="388" fill="#fbbf24" font-size="15" font-weight="400" font-family="monospace">1/16</text>
<text id="chart-2-6" x="985" y="388" fill="#fbbf24" font-size="15" font-weight="400" font-family="monospace">9/16</text>
<text x="44" y="424" fill="#94a3b8" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">Positive aggregate derivative does not mean every context improves. These are local derivatives, not training curves.</text>
<rect x="25" y="460" width="586" height="208" rx="12" fill="#18253b" stroke="#334155"/>
<rect x="628" y="460" width="467" height="208" rx="12" fill="#18253b" stroke="#334155"/>
<text x="44" y="490" fill="#67e8f9" font-size="17" font-weight="700" font-family="DejaVu Sans,sans-serif">Exact projection audit under weights (3/4,1/4)</text>
<text x="44" y="520" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Full target length squared = within-context variance sum</text>
<text x="44" y="552" fill="#dbeafe" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">full = reachable + residual</text>
<text id="pyth-equation" x="333" y="552" fill="#dbeafe" font-size="17" font-weight="400" font-family="monospace">7/16 = 1/64 + 27/64</text>
<text x="44" y="584" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">projection inner product</text>
<text id="projection" x="435" y="584" fill="#dbeafe" font-size="17" font-weight="400" font-family="monospace">0</text>
<text x="44" y="615" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Pythagorean equality residual</text>
<text id="pyth-residual" x="435" y="615" fill="#dbeafe" font-size="17" font-weight="400" font-family="monospace">0</text>
<text x="44" y="645" fill="#94a3b8" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">Independent parameters reach both context targets exactly.</text>
<text x="646" y="490" fill="#67e8f9" font-size="17" font-weight="700" font-family="DejaVu Sans,sans-serif">Reweighting changes the objective</text>
<text x="646" y="522" fill="#dbeafe" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Uniform-objective direction: v = -1/2</text>
<text x="646" y="552" fill="#dbeafe" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Derivative of original weighted objective:</text>
<text id="wrong-objective" x="646" y="586" fill="#fbbf24" font-size="25" font-weight="700" font-family="DejaVu Sans,sans-serif">-1/32</text>
<text x="646" y="618" fill="#fbbf24" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Negative here, although its own objective rises.</text>
<text x="646" y="645" fill="#94a3b8" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">Not an approximation to the original weighted objective.</text>
<rect x="25" y="686" width="1070" height="133" rx="12" fill="#18253b" stroke="#334155"/>
<text x="44" y="715" fill="#67e8f9" font-size="17" font-weight="700" font-family="DejaVu Sans,sans-serif">A global softmax over joint outcomes is a different model</text>
<text x="44" y="742" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Constant logit rows within each context: A0=(0),(0), A1=(1),(1). Conditional policies cannot move.</text>
<text x="44" y="775" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">conditional G</text>
<text id="gauge-0" x="194" y="775" fill="#dbeafe" font-size="16" font-weight="400" font-family="monospace">0</text>
<text x="304" y="775" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">conditional g</text>
<text id="gauge-1" x="454" y="775" fill="#dbeafe" font-size="16" font-weight="400" font-family="monospace">0</text>
<text x="564" y="775" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">naive joint G</text>
<text id="gauge-2" x="714" y="775" fill="#fbbf24" font-size="16" font-weight="400" font-family="monospace">3/16</text>
<text x="824" y="775" fill="#94a3b8" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">naive joint g</text>
<text id="gauge-3" x="974" y="775" fill="#fbbf24" font-size="16" font-weight="400" font-family="monospace">-9/32</text>
<text x="44" y="802" fill="#94a3b8" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">Naive joint logits move context mass, violating the fixed-context model. No such update is used by audit_contexts.</text>
<text x="28" y="849" fill="#94a3b8" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">All displayed derivatives and certificates are exact rationals. Strict positive action and context probabilities.</text>
<text x="28" y="873" fill="#94a3b8" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">Supplied contextual expected rewards, not MDP occupancies, training guarantees or a new natural-gradient algorithm.</text>
</svg>
